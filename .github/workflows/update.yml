name: Update upstream skills

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Move sources to their newest commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sync.mjs --latest
      # Opens a pull request for review; nothing reaches main without one.
      - name: Open a pull request when anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Upstream skills are unchanged."
            exit 0
          fi
          branch="update-upstream-skills-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Update upstream skills"
          git push origin "$branch"
          gh pr create --title "Update upstream skills" \
            --body "Upstream sources moved. Review what changed in vendor/ before merging: these are instructions agents follow."
